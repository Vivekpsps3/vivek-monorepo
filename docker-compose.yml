# Suite on one origin: Hub at /hub, Finance at /finance/, Travel at /travel/, Media at /media/.
# Usage: docker compose --env-file .env up --build
# Open: http://127.0.0.1:8080/hub

services:
  api:
    build:
      context: ./apps/finance/backend
    volumes:
      - ${FINANCE_DATA_DIR:-./data}:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/finance.db}
      API_HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      DISABLE_OPENAPI: ${DISABLE_OPENAPI:-1}
      ALEMBIC_STRICT: ${ALEMBIC_STRICT:-1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  travel:
    build:
      context: ./apps/travel
      dockerfile: Dockerfile
      additional_contexts:
        tokens: ./packages/ui
        browser: ./packages/browser
    volumes:
      - ${FINANCE_DATA_DIR:-./data}:/data
    environment:
      TRAVEL_DATABASE_URL: sqlite:////data/travel.db
      TRAVEL_MOUNT_PATH: /travel
      FINANCE_API_URL: http://api:8000
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  media:
    build:
      context: ./apps/media
      dockerfile: Dockerfile
      additional_contexts:
        tokens: ./packages/ui
    volumes:
      - ${FINANCE_DATA_DIR:-./data}:/data
    environment:
      MEDIA_DATABASE_URL: sqlite:////data/media.db
      MEDIA_MOUNT_PATH: /media
      FINANCE_API_URL: http://api:8000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      MEDIA_SCRAPE_MODE: ${MEDIA_SCRAPE_MODE:-}
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./apps/finance/frontend
      additional_contexts:
        packages: ./packages
    depends_on:
      api:
        condition: service_healthy
      travel:
        condition: service_started
      media:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
