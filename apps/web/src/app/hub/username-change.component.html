<form class="username-form" autocomplete="off" novalidate (ngSubmit)="save()">
  <ui-input
    label="New username"
    autocomplete="off"
    [required]="true"
    [invalid]="errorStatus === 400 || errorStatus === 409"
    [describedBy]="error ? 'username-change-error' : undefined"
    [(value)]="nextName" />
  <ui-input
    label="Current passphrase"
    type="password"
    [showPasswordToggle]="true"
    autocomplete="current-password"
    [required]="true"
    [invalid]="errorStatus === 401"
    [describedBy]="error ? 'username-change-error' : undefined"
    [(value)]="passphrase" />
  <p
    id="username-change-error"
    class="form-error"
    role="alert"
    aria-live="assertive"
    [attr.data-status]="errorStatus === 400 || errorStatus === 401 || errorStatus === 403 || errorStatus === 409 || errorStatus === 422 || errorStatus === 429 ? errorStatus : null">
    {{ error }}
  </p>
  <ui-button type="submit" [disabled]="saving" [busy]="saving">Save</ui-button>
</form>
