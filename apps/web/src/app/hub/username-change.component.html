<form class="username-form" novalidate (ngSubmit)="save()">
  <ui-input
    #usernameField label="New username"
    autocomplete="username"
    [hint]="usernameHint"
    [required]="true"
    [invalid]="invalidField === 'username'"
    [describedBy]="invalidField === 'username' ? 'username-change-error' : undefined"
    [(value)]="nextName" (valueChange)="clearFieldError('username')" />
  <ui-input
    #passphraseField label="Current passphrase"
    type="password"
    [showPasswordToggle]="true"
    autocomplete="current-password"
    [required]="true"
    [invalid]="invalidField === 'passphrase'"
    [describedBy]="invalidField === 'passphrase' ? 'username-change-error' : undefined"
    [(value)]="passphrase" (valueChange)="clearFieldError('passphrase')" />
  <p
    id="username-change-error"
    class="form-error"
    aria-live="polite"
    aria-atomic="true"
    [attr.data-status]="errorStatus === 400 || errorStatus === 401 || errorStatus === 403 || errorStatus === 409 || errorStatus === 422 || errorStatus === 429 ? errorStatus : null">
    {{ error }}
  </p>
  <ui-button type="submit" [disabled]="saving" [busy]="saving">Save</ui-button>
</form>
