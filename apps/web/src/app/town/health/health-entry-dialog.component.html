<ui-dialog [open]="open()" labelledBy="health-entry-title" (closed)="onClosed()">
  <h2 id="health-entry-title">{{ room() === 'clinic' ? 'Add weight' : 'Add lift' }}</h2>
  <p id="health-entry-help">Saved values stay in canonical units. This choice only changes how they are shown.</p>
  <form (submit)="onSubmit($event)" novalidate>
    <ui-field label="Measured on" [required]="true" [error]="message(errors()['measured_on'])">
      <input uiFieldControl id="health-measured-on" name="measured_on" type="date" required
        min="1900-01-01" [attr.max]="today()" data-dialog-initial-focus
        [value]="local().measuredOn" (input)="onMeasured($event)" />
    </ui-field>
    @if (room() === 'gym') {
      <ui-field label="Exercise" [required]="true" [error]="message(errors()['exercise'])">
        <input uiFieldControl id="health-exercise" name="exercise" type="text" required autocomplete="off"
          [value]="local().exercise" (input)="onExercise($event)" />
      </ui-field>
    }
    <ui-field [label]="weightLabel()" [required]="true" [error]="message(errors()['kg'])">
      <input uiFieldControl id="health-weight" name="weight" type="text" inputmode="decimal" required autocomplete="off"
        [value]="local().weight" (input)="onWeight($event)" />
    </ui-field>
    @if (room() === 'gym') {
      <ui-field label="Reps" [required]="true" [error]="message(errors()['reps'])">
        <input uiFieldControl id="health-reps" name="reps" type="text" inputmode="numeric" required autocomplete="off"
          [value]="local().reps" (input)="onReps($event)" />
      </ui-field>
    }
    @if (formError()) {
      <p class="form-error" role="alert">{{ formError() }}</p>
    }
    <div class="dialog-actions">
      <ui-button type="submit" [busy]="busy()" [disabled]="busy()">Save</ui-button>
      <ui-button variant="secondary" (clicked)="onClosed()">Cancel</ui-button>
    </div>
  </form>
</ui-dialog>
