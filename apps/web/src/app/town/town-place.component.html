<nav class="place" aria-label="Current place">
  <ol>
    @for (crumb of crumbs(); track crumb.label; let last = $last) {
      <li>
        @if (last || !crumb.href) {
          <span aria-current="page">{{ crumb.label }}</span>
        } @else {
          <a [routerLink]="crumb.href" [queryParams]="crumb.query ?? null" [replaceUrl]="true">{{ crumb.label }}</a>
        }
      </li>
    }
  </ol>
</nav>
