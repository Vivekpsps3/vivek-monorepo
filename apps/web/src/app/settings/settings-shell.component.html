<div class="settings-shell" [class.is-section]="sectionActive()">
  <main class="settings-main">
    @if (sectionActive()) {
      <a class="settings-back" routerLink="/settings">← Settings</a>
    } @else {
      <h1>Settings</h1>
    }
    <router-outlet />
  </main>
  <nav class="settings-nav" aria-label="Settings">
    @for (group of groups; track group.label) {
      <div class="settings-group">
        @if (group.label) {
          <h2>{{ group.label }}</h2>
        }
        <ul>
          @for (section of group.sections; track section.path) {
            <li>
              <a
                [routerLink]="['/settings', section.path]"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="activeLinkOptions">{{ section.label }}</a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</div>
