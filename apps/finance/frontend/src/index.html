<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Finance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var choice = null;
      try {
        choice = localStorage.getItem('suite-theme') || localStorage.getItem('ft-theme');
        if (!localStorage.getItem('suite-theme') && (choice === 'light' || choice === 'dark' || choice === 'system')) {
          localStorage.setItem('suite-theme', choice);
        }
      } catch (e) {}
      var theme = choice;
      if (choice !== 'light' && choice !== 'dark') {
        choice = 'system';
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-theme-choice', choice);
      document.documentElement.style.colorScheme = theme;
      var mobileQuery = window.matchMedia('(max-width: 768px)');
      var applyViewport = function () {
        document.documentElement.setAttribute('data-viewport', mobileQuery.matches ? 'mobile' : 'desktop');
      };
      applyViewport();
      if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', applyViewport);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Self-hosted personal finance tracker with browser-owned encryption.">
</head>
<body>
  <app-root>
    <main id="auth-static-shell" class="login-shell" hidden>
      <section class="auth-layout">
        <div class="auth-intro">
          <p class="brand-lockup">Account</p>
          <h1>Create account</h1>
          <p class="privacy-note">One account for Hub, Media, Travel and Finance.</p>
        </div>
      </section>
    </main>
  </app-root>
  <script>
    if (location.pathname === '/auth/signup' || location.pathname === '/auth/signup/') {
      var shell = document.getElementById('auth-static-shell');
      if (shell) shell.hidden = false;
    }
  </script>
</body>
</html>
