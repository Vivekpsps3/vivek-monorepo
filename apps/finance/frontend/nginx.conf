server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never let a browser or intermediary reuse authenticated or public API data.
  location ^~ /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Last-Modified;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Both the application shell and its release marker must be fetched afresh.
  location = /index.html {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /version.json {
    default_type application/json;
    try_files $uri @static_asset_not_found;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Angular's production builder emits eight-character URL-safe hashes in
  # entry and lazy bundle names (for example main-ABC123_X.js).
  location ~* "-[A-Za-z0-9_-]{8}[.](?:js|css)$" {
    try_files $uri @static_asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # A missing script, stylesheet, source map, or public asset must never be
  # answered with the SPA shell. Existing unversioned assets revalidate.
  location ^~ /assets/ {
    try_files $uri @static_asset_not_found;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|pdf|txt|webmanifest|xml|wasm)$ {
    try_files $uri @static_asset_not_found;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location @static_asset_not_found {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    return 404 "Not Found\n";
  }

  # Application routes use the SPA shell and are never heuristically cached.
  location / {
    try_files $uri $uri/ /index.html;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
}
