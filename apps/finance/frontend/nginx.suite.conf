# One origin for the suite. Host nginx forwards every path here.
# Finance UI: /finance/   Finance API (health check stays here): /api/
# Travel UI and API: /travel/  → travel container with the prefix removed.
server {
  listen 80;
  server_name _;
  # Keep redirects relative so the public https host and port survive this proxy.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Last-Modified;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ^~ /finance/api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Last-Modified;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /travel {
    return 301 /travel/;
  }

  location ^~ /travel/ {
    proxy_pass http://travel:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /finance {
    return 301 /finance/;
  }

  location = /finance/index.html {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /finance/version.json {
    default_type application/json;
    try_files $uri @static_asset_not_found;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location ~* "^/finance/.+-[A-Za-z0-9_-]{8}[.](?:js|css)$" {
    try_files $uri @static_asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ^~ /finance/assets/ {
    try_files $uri @static_asset_not_found;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* "^/finance/.+\.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|pdf|txt|webmanifest|xml|wasm)$" {
    try_files $uri @static_asset_not_found;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location @static_asset_not_found {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    return 404 "Not Found\n";
  }

  location /finance/ {
    try_files $uri $uri/ /finance/index.html;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /index.html {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location / {
    try_files $uri $uri/ @suite_redirect;
  }

  location @suite_redirect {
    add_header Cache-Control "no-store" always;
    return 302 /finance$request_uri;
  }
}
