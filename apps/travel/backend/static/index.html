<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Travel</title>
  <script>
    (function () {
      var choice = "system";
      try {
        var stored = localStorage.getItem("travel-theme");
        if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
      } catch (error) {}
      var theme = choice;
      if (choice !== "light" && choice !== "dark") {
        var dark = false;
        try {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (error) {}
        theme = dark ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-theme-choice", choice);
    })();
  </script>
  <script>window.TRAVEL_ROOT = "__TRAVEL_ROOT__";</script>
  <link rel="icon" href="__TRAVEL_ROOT__/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/tokens.css">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/static/vendor/leaflet.css">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/static/app.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Travel home">Travel</a>
      <nav class="nav" aria-label="Travel">
        <a href="#/" data-nav="home">Upcoming</a>
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/pto" data-nav="pto">PTO</a>
      </nav>
      <div class="topbar-actions">
        <a class="btn btn-ghost btn-sm hub-link" href="/hub">Hub</a>
        <a class="btn btn-primary btn-sm" href="#/trips/new">New trip</a>
        <div class="theme-switch" role="group" aria-label="Theme">
          <button class="btn btn-ghost btn-sm" type="button" data-action="theme" data-theme-value="system" aria-pressed="true">System</button>
          <button class="btn btn-ghost btn-sm" type="button" data-action="theme" data-theme-value="light" aria-pressed="false">Light</button>
          <button class="btn btn-ghost btn-sm" type="button" data-action="theme" data-theme-value="dark" aria-pressed="false">Dark</button>
        </div>
        <a class="btn btn-ghost btn-sm" href="#/settings" data-nav="settings">Settings</a>
      </div>
    </div>
  </header>
  <main id="app" class="shell"></main>
  <footer class="footer">
    <p>Trips stay in this app. Flight lookup sends the flight number and date to FlightAware. Address search and map tiles use OpenStreetMap.</p>
  </footer>
  <script src="__TRAVEL_ROOT__/static/vendor/leaflet.js"></script>
  <script type="module" src="__TRAVEL_ROOT__/static/app.js"></script>
</body>
</html>
