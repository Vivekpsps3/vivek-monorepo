<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Travel</title>
  <script>
    (function () {
      var choice = "system";
      try {
        var stored = localStorage.getItem("travel-theme");
        if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
      } catch (error) {}
      var theme = choice;
      if (choice !== "light" && choice !== "dark") {
        var dark = false;
        try {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (error) {}
        theme = dark ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-theme-choice", choice);
    })();
  </script>
  <script>window.TRAVEL_ROOT = "__TRAVEL_ROOT__";</script>
  <link rel="icon" href="__TRAVEL_ROOT__/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/tokens.css">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/controls.css">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/static/vendor/leaflet.css">
  <link rel="stylesheet" href="__TRAVEL_ROOT__/static/app.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Travel home">Travel</a>
      <nav class="nav" aria-label="Travel">
        <a href="#/" data-nav="home">Upcoming</a>
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/pto" data-nav="pto">PTO</a>
      </nav>
      <div class="topbar-actions">
        <a class="btn btn-primary btn-sm new-trip" href="#/trips/new"><span class="new-wide">New trip</span><span class="new-narrow">+ New</span></a>
        <a class="btn btn-ghost btn-sm settings-bar" href="#/settings" data-nav="settings" hidden>Settings</a>
        <div class="more">
          <button class="btn btn-ghost btn-sm" type="button" data-action="menu" aria-expanded="false" aria-controls="more-menu" aria-label="More">⋯ More</button>
          <div id="more-menu" class="more-menu" hidden>
            <div class="theme-switch" role="radiogroup" aria-label="Theme">
              <button class="btn btn-ghost btn-sm" type="button" role="radio" data-action="theme" data-theme-value="system" aria-checked="true" aria-pressed="true">System</button>
              <button class="btn btn-ghost btn-sm" type="button" role="radio" data-action="theme" data-theme-value="light" aria-checked="false" aria-pressed="false">Light</button>
              <button class="btn btn-ghost btn-sm" type="button" role="radio" data-action="theme" data-theme-value="dark" aria-checked="false" aria-pressed="false">Dark</button>
            </div>
            <a href="#/settings" data-nav="settings">Settings</a>
            <a href="/hub">Hub</a>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="toasts">
    <div id="toasts" role="status"></div>
    <div id="toast-alerts" role="alert"></div>
  </div>
  <main id="app" class="shell" tabindex="-1"></main>
  <footer class="footer"><p>Travel · <a href="/hub">Back to Hub</a></p></footer>
  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title" data-confirm-title></h2>
    <p data-confirm-body></p>
    <p class="field-error" data-confirm-error role="status" hidden></p>
    <div class="row-actions">
      <button type="button" class="btn" data-confirm-cancel>Cancel</button>
      <button type="button" class="btn btn-ghost btn-danger" data-confirm-ok>Delete</button>
    </div>
  </dialog>
  <script src="__TRAVEL_ROOT__/static/vendor/leaflet.js"></script>
  <script type="module" src="__TRAVEL_ROOT__/static/app.js"></script>
</body>
</html>
