# Direct container for debugging Travel by itself on port 8090 at /.
# The image expects the suite's finance API at http://api:8000, which this
# file does not run. The supported host is the repo-root compose stack:
# /finance/ and /travel/ on one origin.

services:
  travel:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        tokens: ../../packages/ui
    ports:
      - "8090:8000"
    volumes:
      - ../../data:/data
    environment:
      TRAVEL_DATABASE_URL: sqlite:////data/travel.db
      TRAVEL_MOUNT_PATH: ""
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
    restart: unless-stopped
