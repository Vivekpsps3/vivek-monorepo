name: personal-site
services:
  site:
    image: ${SITE_IMAGE:-personal-site:development}
    build:
      context: .
      args:
        SITE_RELEASE: ${SITE_RELEASE:-development}
    user: "${SITE_UID:-10001}:${SITE_GID:-10001}"
    environment:
      SITE_DATABASE_URL: sqlite:////data/site.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      SESSION_COOKIE_SAMESITE: lax
      CORS_ORIGINS: ${CORS_ORIGINS:-https://vivekpanchagnula.com}
      DISABLE_OPENAPI: "1"
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    volumes:
      - ${SITE_DATA_DIR:-/var/lib/personal-site/data}:/data
    ports:
      - "127.0.0.1:${SITE_PORT:-8085}:8000"
    networks:
      site:
        gw_priority: 1
      monitoring:
        aliases: [personal-site]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  probe:
    image: ${SITE_IMAGE:-personal-site:development}
    command: [python, -m, apps.server.monitor]
    user: "10001:10001"
    volumes:
      - ${SITE_METRICS_DIR:-/var/lib/personal-site/metrics}:/status:ro
    networks:
      monitoring:
        aliases: [personal-site-probe]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  monitoring:
    external: true
    name: monitoring
  site:
    ipam:
      config:
        - subnet: ${SITE_SUBNET:-172.30.85.0/28}
