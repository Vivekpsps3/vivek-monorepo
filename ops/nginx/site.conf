# One upstream and one origin. Production app owns every URL.
# HTTP-scope rate/connection budgets. Assets are exempted from request limiting below.
limit_req_zone $binary_remote_addr zone=personal_site:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=personal_connections:10m;
log_format personal_site '$remote_addr [$time_local] "$request_method $uri" $status '
                         'bytes=$body_bytes_sent duration=$request_time upstream=$upstream_addr '
                         'upstream_status=$upstream_status upstream_time=$upstream_response_time request_id=$request_id';

server {
    listen 80;
    listen [::]:80;
    server_name vivekpanchagnula.com www.vivekpanchagnula.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vivekpanchagnula.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vivekpanchagnula.com;
    ssl_certificate /etc/letsencrypt/live/vivekpanchagnula.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivekpanchagnula.com/privkey.pem;
    return 301 https://vivekpanchagnula.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vivekpanchagnula.com;
    ssl_certificate /etc/letsencrypt/live/vivekpanchagnula.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivekpanchagnula.com/privkey.pem;
    access_log /dev/stdout personal_site;
    error_log /dev/stderr warn;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_conn personal_connections 40;
    limit_req zone=personal_site burst=100 nodelay;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # The application sends the enforced per-app Content-Security-Policy,
    # Reporting-Endpoints, COOP, CORP, Permissions-Policy, and X-Frame-Options.
    # Do not add a second CSP here: browsers enforce every policy they receive.
    # This file is not applied by the deploy workflow. After editing the host
    # copy, run: nginx -t && nginx -s reload
    # Origin separation for the finance vault is documented in docs/SECURITY_MODEL.md
    # and is not enabled in this vhost.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /metrics { return 404; }
    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location = /csp-report {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host vivekpanchagnula.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host vivekpanchagnula.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
