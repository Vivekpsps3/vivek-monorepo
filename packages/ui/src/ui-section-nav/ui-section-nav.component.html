<nav class="ui-section-nav" [attr.aria-label]="label()">
  <div class="ui-section-nav__scroller" #scroller>
    @for (item of items(); track item.link) {
      <a
        class="ui-section-nav__link"
        [routerLink]="item.link"
        routerLinkActive="is-current"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: !!item.exact }">
        <span class="ui-section-nav__full">{{ item.label }}</span>
        @if (item.shortLabel) {
          <span class="ui-section-nav__short">{{ item.shortLabel }}</span>
        }
      </a>
    }
  </div>
</nav>
