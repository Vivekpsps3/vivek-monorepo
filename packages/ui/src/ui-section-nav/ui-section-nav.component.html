<nav class="ui-section-nav" [attr.aria-label]="label()">
  <div class="ui-section-nav__scroller" #scroller>
    @for (item of items(); track item.link) {
      <a
        class="ui-section-nav__link"
        [class.is-current]="current(item)"
        [attr.aria-current]="current(item) ? 'page' : null"
        [attr.aria-label]="item.ariaLabel ?? null"
        [routerLink]="item.link"
        routerLinkActive="is-current"
        [routerLinkActiveOptions]="item.exact ? exactMatch : subsetMatch"
        (isActiveChange)="setActive(item.link, $event)">
        <span class="ui-section-nav__full">{{ item.label }}</span>
        @if (item.shortLabel) {
          <span class="ui-section-nav__short">{{ item.shortLabel }}</span>
        }
      </a>
      @for (extra of item.also ?? []; track extra) {
        <span hidden tabindex="-1" [routerLink]="extra" routerLinkActive [routerLinkActiveOptions]="subsetMatch" (isActiveChange)="setActive(extra, $event)"></span>
      }
    }
  </div>
</nav>
