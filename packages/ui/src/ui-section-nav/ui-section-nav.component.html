<nav class="ui-section-nav" [attr.aria-label]="label()">
  <div class="ui-section-nav__links">
    @for (item of links(); track item.link) {
      <a class="ui-section-nav__link"
        [class.is-current]="current() === item.link"
        [attr.aria-current]="current() === item.link ? 'page' : null"
        [attr.aria-label]="item.ariaLabel ?? null"
        [routerLink]="item.url">
        {{ item.label }}
      </a>
    }
  </div>
</nav>
