<div class="ui-field">
  @if (label()) {
    <label class="ui-field__label" [for]="resolvedId()">{{ label() }}@if (required()) { <span class="ui-field__required"> (required)</span> }</label>
  }
  <div class="ui-field__control-wrap">
    <select
      class="ui-field__control"
      [id]="resolvedId()"
      [disabled]="disabled()"
      [required]="required()"
      [value]="value()"
      (change)="value.set($any($event.target).value)">
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value" [selected]="opt.value === value()" [disabled]="opt.disabled ?? false">{{ opt.label }}</option>
      }
    </select>
    <span class="ui-field__chevron" aria-hidden="true"></span>
  </div>
</div>
