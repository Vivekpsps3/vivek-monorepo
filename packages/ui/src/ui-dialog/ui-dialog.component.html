@if (open()) {
  <div class="ui-dialog-backdrop" role="presentation" (click)="onBackdrop()">
    <div
      #panel
      class="ui-dialog-panel"
      [attr.class]="'ui-dialog-panel ' + panelClass()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="labelledBy() || null"
      [attr.aria-describedby]="describedBy() || null"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)">
      <ng-content />
      @if (updateNotice?.noticeVisible()) {
        <aside class="ui-dialog-update" aria-live="polite">
          <p>{{ updateNotice?.updateAvailable() ? 'A new version is ready.' : 'A page section could not load.' }} Finish or save your edits before reloading.</p>
          <button type="button" (click)="updateNotice?.dismissNotice()">Dismiss update notice</button>
        </aside>
      }
    </div>
  </div>
}
