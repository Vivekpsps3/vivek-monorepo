<div class="ui-field" [class.ui-field--invalid]="!!error()">
  @if (label()) {
    <div class="ui-field__label">
      <label [for]="resolvedId()">{{ label() }}@if (optional() && !required()) { <span class="ui-field__optional"> (optional)</span> }</label>
      @if (required()) { <span class="ui-field__required" aria-hidden="true"> (required)</span> }
    </div>
  }
  <ng-content />
  @if (hint()) {
    <p class="ui-field__hint" [id]="resolvedId() + '-hint'">{{ hint() }}</p>
  }
  <p
    class="ui-field__error"
    [id]="resolvedId() + '-error'"
  >
    @if (error()) {
      <span aria-hidden="true">⚠</span>
      {{ error() }}
    }
  </p>
</div>
