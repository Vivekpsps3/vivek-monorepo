</defs><g font-family="system-ui, sans-serif"><rect width="390" height="3564" fill="#f6f3ee"/><text x="24" y="60" font-size="22" fill="#66695e" font-weight="600">LIVING WORLD / STUDY</text><text x="24" y="120.1" font-size="32" fill="#0f6e6a" font-weight="600">Hall</text><rect x="226" y="92.1" width="140" height="66" rx="8" fill="#fffcf6" stroke="#d6d2c5"/><text x="240" y="135.1" font-size="30" fill="#292b27" font-weight="600">Menu</text><text x="24" y="208.1" font-size="60" fill="#292b27" font-weight="400">How your</text><text x="24" y="301.1" font-size="60" fill="#292b27" font-weight="400">town grows</text><text x="24" y="398.1" font-size="30" fill="#66695e" font-weight="400">Rules, appearance</text><text x="24" y="444.6" font-size="30" fill="#66695e" font-weight="400">and your private</text><text x="24" y="491.1" font-size="30" fill="#66695e" font-weight="400">weekly review</text><text x="24" y="561.6" font-size="30" fill="#0f6e6a" font-weight="400">Progress &amp; rules ·</text><text x="24" y="608.1" font-size="30" fill="#0f6e6a" font-weight="400">Appearance · Weekly</text><text x="24" y="654.6" font-size="30" fill="#0f6e6a" font-weight="400">review</text><text x="24" y="813.1" font-size="40" fill="#292b27" font-weight="600">Your existing</text><text x="24" y="875.1" font-size="40" fill="#292b27" font-weight="600">rules</text><text x="24" y="939.1" font-size="32" fill="#292b27" font-weight="400">A habit check · 10</text><text x="24" y="988.7" font-size="32" fill="#292b27" font-weight="400">XP</text><text x="24" y="1038.3" font-size="28" fill="#66695e" font-weight="400">Building levels: 0 /</text><text x="24" y="1081.7" font-size="28" fill="#66695e" font-weight="400">50 / 150 / 400 / 1000</text><text x="24" y="1125.1000000000001" font-size="28" fill="#66695e" font-weight="400">XP. Existing Town</text><text x="24" y="1168.5000000000002" font-size="28" fill="#66695e" font-weight="400">thresholds and lot</text><text x="24" y="1211.9000000000003" font-size="28" fill="#66695e" font-weight="400">unlocks stay</text><text x="24" y="1255.3000000000004" font-size="28" fill="#66695e" font-weight="400">authoritative.</text><text x="24" y="1330.7000000000005" font-size="32" fill="#292b27" font-weight="400">Treasury · Finance</text><text x="24" y="1380.3000000000004" font-size="32" fill="#292b27" font-weight="400">budget weeks</text><text x="24" y="1429.9000000000003" font-size="28" fill="#66695e" font-weight="400">Habit streaks do not</text><text x="24" y="1473.3000000000004" font-size="28" fill="#66695e" font-weight="400">count as budget</text><text x="24" y="1516.7000000000005" font-size="28" fill="#66695e" font-weight="400">weeks. Locked, no</text><text x="24" y="1560.1000000000006" font-size="28" fill="#66695e" font-weight="400">plan and unavailable</text><text x="24" y="1603.5000000000007" font-size="28" fill="#66695e" font-weight="400">have separate</text><text x="24" y="1646.9000000000008" font-size="28" fill="#66695e" font-weight="400">explanations.</text><text x="24" y="1790.3000000000009" font-size="40" fill="#292b27" font-weight="600">Appearance ·</text><text x="24" y="1852.3000000000009" font-size="40" fill="#292b27" font-weight="600">this device</text><text x="24" y="1916.3000000000009" font-size="32" fill="#292b27" font-weight="400">Season · Default</text><text x="24" y="1965.9000000000008" font-size="28" fill="#66695e" font-weight="400">Spring / Summer /</text><text x="24" y="2009.3000000000009" font-size="28" fill="#66695e" font-weight="400">Autumn / Winter /</text><text x="24" y="2052.7000000000007" font-size="28" fill="#66695e" font-weight="400">Automatic. Automatic</text><text x="24" y="2096.100000000001" font-size="28" fill="#66695e" font-weight="400">uses browser-local</text><text x="24" y="2139.500000000001" font-size="28" fill="#66695e" font-weight="400">month, not your</text><text x="24" y="2182.900000000001" font-size="28" fill="#66695e" font-weight="400">location.</text><text x="24" y="2258.300000000001" font-size="32" fill="#292b27" font-weight="400">Sound · Off</text><text x="24" y="2307.900000000001" font-size="28" fill="#66695e" font-weight="400">Enable deliberately.</text><text x="24" y="2351.300000000001" font-size="28" fill="#66695e" font-weight="400">Muting never removes</text><text x="24" y="2394.700000000001" font-size="28" fill="#66695e" font-weight="400">useful feedback.</text><rect x="24" y="2470.1000000000013" width="342" height="108" rx="8" fill="#0f6e6a"/><text x="38" y="2513.1000000000013" font-size="30" fill="#f6f3ee" font-weight="600">Preview</text><text x="38" y="2555.1000000000013" font-size="30" fill="#f6f3ee" font-weight="600">appearance</text><text x="24" y="2686.1000000000013" font-size="40" fill="#292b27" font-weight="600">Weekly review ·</text><text x="24" y="2748.1000000000013" font-size="40" fill="#292b27" font-weight="600">encrypted</text><text x="24" y="2812.1000000000013" font-size="32" fill="#292b27" font-weight="400">26 October – 1</text><text x="24" y="2861.700000000001" font-size="32" fill="#292b27" font-weight="400">November 2026</text><text x="24" y="2911.300000000001" font-size="28" fill="#66695e" font-weight="400">Unlock to open the</text><text x="24" y="2954.700000000001" font-size="28" fill="#66695e" font-weight="400">single existing</text><text x="24" y="2998.1000000000013" font-size="28" fill="#66695e" font-weight="400">weekly-review editor.</text><text x="24" y="3041.5000000000014" font-size="28" fill="#66695e" font-weight="400">Review text is never</text><text x="24" y="3084.9000000000015" font-size="28" fill="#66695e" font-weight="400">shown in this scene</text><text x="24" y="3128.3000000000015" font-size="28" fill="#66695e" font-weight="400">or on Hub.</text><rect x="24" y="3203.7000000000016" width="342" height="108" rx="8" fill="#0f6e6a"/><text x="38" y="3246.7000000000016" font-size="30" fill="#f6f3ee" font-weight="600">Unlock for</text><text x="38" y="3288.7000000000016" font-size="30" fill="#f6f3ee" font-weight="600">review</text><text x="24" y="3403.7000000000016" font-size="22" fill="#66695e" font-weight="400">PROPOSED DESIGN · synthetic</text><text x="24" y="3437.8000000000015" font-size="22" fill="#66695e" font-weight="400">content · approval and</text><text x="24" y="3471.9000000000015" font-size="22" fill="#66695e" font-weight="400">application implementation</text><text x="24" y="3506.0000000000014" font-size="22" fill="#66695e" font-weight="400">pending</text></g></svg>
