="1409.0" font-size="32" fill="#292b27" font-weight="400">Why a book is here</text><text x="24" y="1458.6" font-size="28" fill="#66695e" font-weight="400">A completed Media</text><text x="24" y="1502.0" font-size="28" fill="#66695e" font-weight="400">record creates this</text><text x="24" y="1545.4" font-size="28" fill="#66695e" font-weight="400">keepsake. Its date</text><text x="24" y="1588.8000000000002" font-size="28" fill="#66695e" font-weight="400">comes from the</text><text x="24" y="1632.2000000000003" font-size="28" fill="#66695e" font-weight="400">completion record.</text><text x="24" y="1707.6000000000004" font-size="32" fill="#292b27" font-weight="400">Source · Media</text><text x="24" y="1757.2000000000003" font-size="32" fill="#292b27" font-weight="400">available</text><text x="24" y="1806.8000000000002" font-size="28" fill="#66695e" font-weight="400">Illustrative</text><text x="24" y="1850.2000000000003" font-size="28" fill="#66695e" font-weight="400">landscape; generated</text><text x="24" y="1893.6000000000004" font-size="28" fill="#66695e" font-weight="400">scenery is not a</text><text x="24" y="1937.0000000000005" font-size="28" fill="#66695e" font-weight="400">reconstruction of</text><text x="24" y="1980.4000000000005" font-size="28" fill="#66695e" font-weight="400">your destination.</text><rect x="24" y="2055.8000000000006" width="342" height="66" rx="8" fill="#0f6e6a"/><text x="38" y="2098.8000000000006" font-size="30" fill="#f6f3ee" font-weight="600">Open this book</text><text x="24" y="2161.8000000000006" font-size="30" fill="#0f6e6a" font-weight="400">Back to 15 August in</text><text x="24" y="2208.3000000000006" font-size="30" fill="#0f6e6a" font-weight="400">Pixels</text><text x="24" y="2314.8000000000006" font-size="28" fill="#66695e" font-weight="400">Activity overlay: off</text><text x="24" y="2358.2000000000007" font-size="28" fill="#66695e" font-weight="400">· Unrecorded days</text><text x="24" y="2401.600000000001" font-size="28" fill