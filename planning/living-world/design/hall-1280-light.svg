</defs><g font-family="system-ui, sans-serif"><rect width="1280" height="1050" fill="#f6f3ee"/><text x="24" y="30" font-size="11" fill="#66695e" font-weight="600">LIVING WORLD / STUDY</text><text x="24" y="60.05" font-size="16" fill="#66695e" font-weight="400">Town</text><text x="129" y="60.05" font-size="16" fill="#66695e" font-weight="400">World</text><text x="234" y="60.05" font-size="16" fill="#66695e" font-weight="400">Pixels</text><text x="339" y="60.05" font-size="16" fill="#0f6e6a" font-weight="600">Hall</text><text x="24" y="104.05" font-size="36" fill="#292b27" font-weight="400">How your town grows</text><text x="24" y="163.85" font-size="15" fill="#66695e" font-weight="400">Rules, appearance and your private weekly review</text><text x="24" y="199.1" font-size="15" fill="#0f6e6a" font-weight="400">Progress &amp; rules · Appearance · Weekly review</text><text x="24" y="278.35" font-size="20" fill="#292b27" font-weight="600">Your existing rules</text><text x="24" y="310.35" font-size="16" fill="#292b27" font-weight="400">A habit check · 10 XP</text><text x="24" y="335.15000000000003" font-size="14" fill="#66695e" font-weight="400">Building levels: 0 / 50 / 150 / 400 / 1000 XP. Existing Town thresholds and lot unlocks stay</text><text x="24" y="356.85" font-size="14" fill="#66695e" font-weight="400">authoritative.</text><text x="24" y="394.55" font-size="16" fill="#292b27" font-weight="400">Treasury · Finance budget weeks</text><text x="24" y="419.35" font-size="14" fill="#66695e" font-weight="400">Habit streaks do not count as budget weeks. Locked, no plan and unavailable have separate</text><text x="24" y="441.05" font-size="14" fill="#66695e" font-weight="400">explanations.</text><text x="24" y="518.75" font-size="20" fill="#292b27" font-weight="600">Appearance · this device</text><text x="24" y="550.75" font-size="16" fill="#292b27" font-weight="400">Season · Default</text><text x="24" y="575.55" font-size="14" fill="#66695e" font-weight="400">Spring / Summer / Autumn / Winter / Automatic. Automatic uses browser-local month, not your</text><text x="24" y="597.25" font-size="14" fill="#66695e" font-weight="400">location.</text><text x="24" y="634.95" font-size="16" fill="#292b27" font-weight="400">Sound · Off</text><text x="24" y="659.75" font-size="14" fill="#66695e" font-weight="400">Enable deliberately. Muting never removes useful feedback.</text><rect x="24" y="697.45" width="250" height="45" rx="8" fill="#0f6e6a"/><text x="38" y="724.95" font-size="15" fill="#f6f3ee" font-weight="600">Preview appearance</text><text x="24" y="802.45" font-size="20" fill="#292b27" font-weight="600">Weekly review · encrypted</text><text x="24" y="834.45" font-size="16" fill="#292b27" font-weight="400">26 October – 1 November 2026</text><text x="24" y="859.25" font-size="14" fill="#66695e" font-weight="400">Unlock to open the single existing weekly-review editor. Review text is never shown in this</text><text x="24" y="880.95" font-size="14" fill="#66695e" font-weight="400">scene or on Hub.</text><rect x="24" y="918.6500000000001" width="250" height="45" rx="8" fill="#0f6e6a"/><text x="38" y="946.1500000000001" font-size="15" fill="#f6f3ee" font-weight="600">Unlock for review</text><text x="24" y="1009.6500000000001" font-size="11" fill="#66695e" font-weight="400">PROPOSED DESIGN · synthetic content · approval and application implementation pending</text></g></svg>
