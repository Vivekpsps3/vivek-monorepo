name: Set up Python
description: Install the hashed Python lock used by CI
inputs:
  dev:
    description: Also install requirements-dev.txt
    required: false
    default: "false"
  cache-dependency-path:
    description: Pip cache key files
    required: false
    default: apps/server/requirements.lock
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - shell: bash
      run: python -m pip install --require-hashes -r apps/server/requirements.lock
    - if: inputs.dev == 'true'
      shell: bash
      run: python -m pip install --require-hashes -r requirements-dev.txt
