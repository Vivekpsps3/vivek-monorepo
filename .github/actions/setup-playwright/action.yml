name: Set up Playwright
description: Install Node, cache Chromium, and install that browser once
inputs:
  install-node:
    description: Run the Node setup action. Set false when Node is already installed.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.install-node == 'true'
      uses: ./.github/actions/setup-node
    - id: playwright-version
      shell: bash
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright browser
      shell: bash
      # Chromium only. `--with-deps` apt-installs font packages and has taken
      # about 16 minutes on a cold GitHub-hosted runner.
      run: npx playwright install chromium
