name: Set up Node
description: Install Node 24, and npm ci when this job runs JavaScript
inputs:
  cache:
    description: Restore the npm cache
    required: false
    default: "true"
  install:
    description: Run npm ci
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.cache == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: package-lock.json
    - if: inputs.cache != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
    - if: inputs.install == 'true'
      shell: bash
      run: npm ci
