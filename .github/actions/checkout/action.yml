name: Check out
description: Check out this repository at the pinned actions/checkout revision
inputs:
  fetch-depth:
    description: Number of commits to fetch. 0 fetches all history.
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
