name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vivek-monorepo-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, finance-prod]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Resolve tested release and reject stale candidates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            sha="$CI_SHA"
            run_id="$CI_RUN"
          else
            sha="$MANUAL_SHA"
            run_id="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"$sha\") | .id" | head -1)"
            test -n "$run_id"
          fi
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$sha" = "$current"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-site-release
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
      - name: Sync deployment definition to tested SHA
        env:
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git -C /home/vivek/Deployments/vivek-monorepo fetch origin
          git -C /home/vivek/Deployments/vivek-monorepo checkout --detach "$RELEASE"
      - name: Deploy tested image with verified backup and rollback
        env:
          RELEASE: ${{ steps.release.outputs.sha }}
        run: DOCKER_COMMAND="sudo -n docker" /home/vivek/Deployments/vivek-monorepo/scripts/deploy-site.sh "$RELEASE" "$GITHUB_WORKSPACE/release/image.tar.gz"
