name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vivek-monorepo-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, finance-prod]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Resolve tested release and reject stale candidates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            sha="$CI_SHA"
            run_id="$CI_RUN"
          else
            sha="$MANUAL_SHA"
            run_id="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"$sha\") | .id" | head -1)"
            test -n "$run_id"
          fi
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$sha" = "$current"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Require the seeded schema rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Unified Site Release") | .steps[] | select(.name == "Seeded schema rehearsals") | .conclusion] | first // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "Seeded schema rehearsals concluded '${conclusion:-missing}'; refusing to deploy" >&2
            exit 1
          fi
      - name: Create temporary deployment workspace
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/personal-site.XXXXXXXX")"
          echo "SITE_DEPLOY_TEMP=$scratch" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-site-release
          path: ${{ env.SITE_DEPLOY_TEMP }}/release
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
      - name: Check out tested deployment definition temporarily
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          source_dir="$SITE_DEPLOY_TEMP/source"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "https://github.com/$REPOSITORY.git"
          git -C "$source_dir" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --quiet --depth=1 origin "$RELEASE"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$RELEASE"
      - name: Deploy tested image with verified backup and rollback
        env:
          RELEASE: ${{ steps.release.outputs.sha }}
        run: DOCKER_COMMAND="sudo -n docker" "$SITE_DEPLOY_TEMP/source/scripts/deploy-site.sh" "$RELEASE" "$SITE_DEPLOY_TEMP/release/image.tar.gz"
      - name: Remove temporary checkout and release artifact
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${SITE_DEPLOY_TEMP:-}" ]]; then
            case "$SITE_DEPLOY_TEMP" in
              "$RUNNER_TEMP"/personal-site.*) rm -rf -- "$SITE_DEPLOY_TEMP" ;;
              *) echo "Refusing unexpected cleanup path" >&2; exit 1 ;;
            esac
          fi
