name: CI

on:
  pull_request:
    # labeled and unlabeled retrigger the run. A re-run replays the original
    # payload, so the ratchet-increase label would otherwise stay invisible
    # until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Finance Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock && python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint allowances did not rise
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RATCHET_ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'ratchet-increase') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$RATCHET_ALLOW_INCREASE" = "true" ]; then
            echo "ratchet-increase label is present; a higher allowance is accepted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ratchet-increase label is absent." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/quality_ratchet.py check-tools "origin/${BASE_REF}"
          tools="$(python3 scripts/quality_ratchet.py list)"
          if [ -z "$tools" ]; then
            echo "quality_ratchet.py list printed no tools" >&2
            exit 1
          fi
          for tool in $tools; do
            python3 scripts/quality_ratchet.py check-base "$tool" "origin/${BASE_REF}"
          done
      - run: ./scripts/coverage-gate.sh finance
      - run: ./scripts/coverage-gate.sh server
      - run: make test-fast
      - run: make lint-python
      - run: make typecheck-python
      - run: pip-audit --disable-pip --no-deps -r apps/server/requirements.lock

  travel-backend:
    name: Travel Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
            apps/travel/backend/requirements.txt
            apps/travel/backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock && python -m pip install --require-hashes -r requirements-dev.txt
      - run: ./scripts/coverage-gate.sh travel
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test apps/travel/backend/static/tests/*.test.mjs

  media-backend:
    name: Media Journal Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
            apps/media/backend/requirements.txt
            apps/media/backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock && python -m pip install --require-hashes -r requirements-dev.txt
      - run: ./scripts/coverage-gate.sh media
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test apps/media/backend/static/tests/*.test.mjs

  media-e2e:
    name: Media Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements.lock
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/finance/frontend/package-lock.json
      - run: npm ci --prefix apps/finance/frontend
      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/finance/frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # ubuntu-latest already has Chromium's shared libraries (libnss3 and the
      # rest). `playwright install --with-deps` still apt-installs nine font
      # packages. On main's Media Playwright job (run 39805626702) that
      # download crawled at 18 kB/s, retried fonts-wqy-zenhei, and took about
      # 16 minutes. The browser zip itself took a few seconds. Install
      # Chromium only. Screenshots are saved, not pixel-compared.
      - name: Install Playwright browser
        working-directory: apps/finance/frontend
        run: npx playwright install chromium
      - run: NODE_PATH=apps/finance/frontend/node_modules apps/finance/frontend/node_modules/.bin/playwright test --config apps/media/e2e/playwright.config.ts

  travel-e2e:
    name: Travel Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements.lock
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/finance/frontend/package-lock.json
      - run: npm ci --prefix apps/finance/frontend
      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/finance/frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        working-directory: apps/finance/frontend
        run: npx playwright install chromium
      - working-directory: apps/travel/e2e
        run: NODE_PATH=../../../apps/finance/frontend/node_modules ../../../apps/finance/frontend/node_modules/.bin/playwright test
        env:
          PYTHON: python

  frontends:
    name: Frontend Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: apps/finance/frontend, lock: apps/finance/frontend/package-lock.json }
          - { dir: apps/site, lock: apps/site/package-lock.json }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app.lock }}
      - working-directory: ${{ matrix.app.dir }}
        run: npm ci
      - working-directory: ${{ matrix.app.dir }}
        run: npm audit --omit=dev --audit-level=high
      - name: ESLint
        run: |
          if [ "${{ matrix.app.dir }}" = "apps/finance/frontend" ]; then
            python3 scripts/quality_ratchet.py check eslint-finance
            python3 scripts/quality_ratchet.py check eslint-packages
          else
            python3 scripts/quality_ratchet.py check eslint-site
          fi
      - name: Typecheck
        run: |
          if [ "${{ matrix.app.dir }}" = "apps/finance/frontend" ]; then
            npx --prefix apps/finance/frontend tsc -p apps/finance/frontend/tsconfig.app.json --noEmit --pretty false
            npx --prefix apps/finance/frontend tsc -p apps/finance/frontend/tsconfig.spec.json --noEmit --pretty false
            npx --prefix apps/finance/frontend tsc -p packages/tsconfig.json --noEmit --pretty false
          else
            npx --prefix apps/site tsc -p apps/site/tsconfig.app.json --noEmit --pretty false
            npx --prefix apps/site tsc -p apps/site/tsconfig.spec.json --noEmit --pretty false
          fi
      - working-directory: ${{ matrix.app.dir }}
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI
      - name: Karma coverage summary
        if: always()
        working-directory: ${{ matrix.app.dir }}
        run: |
          if [ ! -d coverage ]; then
            exit 0
          fi
          summary=$(find coverage -name coverage-summary.json -print -quit)
          if [ -n "$summary" ]; then
            node "$GITHUB_WORKSPACE/scripts/karma-coverage-summary.mjs" "$summary" "${{ matrix.app.dir }}"
          fi
      - working-directory: ${{ matrix.app.dir }}
        run: npx ng build --configuration production

  unified:
    # deploy.yml "Require the seeded schema rehearsal" matches this name.
    name: Unified Site Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A depth-1 push checkout leaves origin/main with no parents, and
          # github.event.before is not in the clone. The rehearsal also
          # unshallows itself; this keeps the pre-merge commit in the graph.
          fetch-depth: 0
      - name: Rehearsal preflight survives a depth-1 clone
        run: |
          set -euo pipefail
          origin="$(git remote get-url origin)"
          probe="$(mktemp -d)"
          shallow="$(mktemp -d)"
          cleanup() { rm -rf "$probe" "$shallow"; }
          trap cleanup EXIT
          git clone --depth 2 --no-tags "$origin" "$probe"
          upgrade_from="$(git -C "$probe" rev-parse HEAD^1)"
          test -n "$upgrade_from"
          git clone --depth 1 --no-tags "$origin" "$shallow"
          test "$(git -C "$shallow" rev-parse --is-shallow-repository)" = true
          legacy=8dc554e8094237419571551ff82b0fbfe115bfbd
          grep -q "$legacy" scripts/validate-seeded-adoption.sh
          git -C "$shallow" fetch --no-tags origin "$legacy"
          git -C "$shallow" fetch --no-tags origin main
          if git -C "$shallow" merge-base --is-ancestor "$legacy" "$(git -C "$shallow" rev-parse origin/main)"; then
            echo "depth-1 origin/main already has ancestry to $legacy; self-test did not reproduce the failure" >&2
            exit 1
          fi
          if git -C "$shallow" cat-file -e "${upgrade_from}^{commit}" 2>/dev/null; then
            echo "depth-1 clone already contains UPGRADE_FROM $upgrade_from" >&2
            exit 1
          fi
          cp scripts/validate-seeded-adoption.sh "$shallow/scripts/validate-seeded-adoption.sh"
          PREFLIGHT_ONLY=1 UPGRADE_FROM="$upgrade_from" bash "$shallow/scripts/validate-seeded-adoption.sh"
          git -C "$shallow" merge-base --is-ancestor "$legacy" "$(git -C "$shallow" rev-parse origin/main)"
          git -C "$shallow" cat-file -e "${upgrade_from}^{commit}"
          test "$(git -C "$shallow" rev-parse --is-shallow-repository)" = false
          echo "depth-1 preflight passed for UPGRADE_FROM $upgrade_from"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: python -m pip install --require-hashes -r apps/server/requirements.lock
      - name: Check model/migration drift
        run: python -m apps.server.migrations --check
      - name: Decide whether to rehearse schema changes
        id: migrations
        run: |
          set -euo pipefail
          # Anchored, so the Alembic alternative has to consume the rest of
          # the path. A bare "apps/server/alembic/" never matches a file name.
          pattern='^(apps/[^/]+/backend/models\.py|apps/server/alembic(/.*|\.ini)|apps/server/(migrations|schema|migrate|database)\.py|scripts/(seed_dev_db\.py|validate-seeded-adoption\.sh|backup-site\.py|deploy-site\.sh)|compose\.yml|Dockerfile|\.github/workflows/ci\.yml)$'
          check() {
            path="$1"
            expect="$2"
            if printf '%s\n' "$path" | grep -Eq "$pattern"; then
              got=run
            else
              got=skip
            fi
            if [ "$got" != "$expect" ]; then
              echo "rehearsal path gate: $path expected $expect, got $got" >&2
              exit 1
            fi
          }
          check apps/server/alembic/versions/site_schema_v2_x.py run
          check apps/server/alembic/env.py run
          check apps/server/alembic.ini run
          check compose.yml run
          check Dockerfile run
          check scripts/deploy-site.sh run
          check .github/workflows/ci.yml run
          check apps/travel/backend/models.py run
          check apps/finance/backend/models.py run
          check apps/server/migrations.py run
          check apps/server/schema.py run
          check apps/server/migrate.py run
          check apps/server/database.py run
          check scripts/seed_dev_db.py run
          check scripts/validate-seeded-adoption.sh run
          check scripts/backup-site.py run
          check apps/server/alembic skip
          check apps/server/main.py skip
          check docs/MIGRATIONS.md skip
          check .github/workflows/deploy.yml skip
          # Push to main always rehearses. A later unrelated commit must not
          # deploy over a red rehearsal that this diff no longer mentions.
          # Pull requests still use the path gate. Either way, a revision
          # file that already exists on the base cannot be edited in place.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="FETCH_HEAD"
          else
            before="${{ github.event.before }}"
            # A new-branch push sets before to forty zeros. A force-push can
            # name a tip this clone cannot fetch. Fall through with the first
            # parent so the revision check still runs, instead of exiting first.
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags origin "$before" || true
              if git cat-file -e "${before}^{commit}" 2>/dev/null; then
                range="$before"
              fi
            fi
            if [ -z "${range:-}" ]; then
              if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
                git fetch --no-tags --deepen=1 origin || true
              fi
              if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
                echo "no parent commit for the revision immutability check; rehearsing anyway" >&2
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              range="HEAD^1"
            fi
          fi
          edited="$(git diff --diff-filter=MDR --name-only "$range" HEAD -- apps/server/alembic/versions/)"
          if [ -n "$edited" ]; then
            echo "existing Alembic revisions were modified or removed; add a new revision instead:" >&2
            printf '%s\n' "$edited" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$range" HEAD | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build immutable production image
        run: docker build --build-arg SITE_RELEASE=${{ github.sha }} --tag personal-site:${{ github.sha }} .
      - name: Exercise unified release
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m,mode=1777 personal-site:${{ github.sha }} python -m apps.server.checks
      # deploy.yml "Require the seeded schema rehearsal" matches this name.
      - name: Seeded schema rehearsals
        if: steps.migrations.outputs.run == 'true'
        env:
          SITE_IMAGE: personal-site:${{ github.sha }}
          PY: python
          REHEARSAL: both
          # Pin off. PREFLIGHT_ONLY=1 exits 0 before any database work, and
          # Deploy accepts this step on its conclusion alone.
          PREFLIGHT_ONLY: "0"
          UPGRADE_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/validate-seeded-adoption.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/finance/frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install browser tooling
        working-directory: apps/finance/frontend
        run: |
          npm ci
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser checks against production image
        run: |
          set -euo pipefail
          docker network inspect monitoring >/dev/null 2>&1 || docker network create monitoring
          printf 'SESSION_COOKIE_SECURE=0\nSITE_PORT=8086\nSITE_IMAGE=personal-site:${{ github.sha }}\n' > /tmp/site-ci.env
          docker compose --env-file /tmp/site-ci.env --profile ops run --rm --no-deps backup python -m apps.server.migrate --output /data/site.db
          docker compose --env-file /tmp/site-ci.env up -d --no-build --wait --wait-timeout 60
          node scripts/test-site-browser.mjs
      - name: Browser container diagnostics and cleanup
        if: always()
        run: |
          if [ -f /tmp/site-ci.env ]; then
            docker compose --env-file /tmp/site-ci.env logs --tail 30 || true
            docker compose --env-file /tmp/site-ci.env --profile ops down -v || true
          fi
      - name: Package tested image
        run: |
          set -euo pipefail
          docker save personal-site:${{ github.sha }} | gzip > image.tar.gz
          echo "${{ github.sha }}" > release.sha
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-site-release
          path: |
            image.tar.gz
            release.sha
          retention-days: 14

  e2e:
    name: Finance Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/finance/frontend/package-lock.json
      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/finance/frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npm ci --prefix apps/finance/frontend
      - name: Install Playwright browser
        working-directory: apps/finance/frontend
        run: |
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - run: make e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            apps/finance/frontend/test-results
            apps/finance/frontend/playwright-report
          retention-days: 7
