name: CI

# A new commit replaces checks for the same PR or branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    # labeled and unlabeled retrigger the run. A re-run replays the original
    # payload, so the ratchet-increase label would otherwise stay invisible
    # until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - master

# Trusted pushes and same-repository PRs use the local CI runner. Fork PRs
# stay on GitHub infrastructure because they execute contributor-controlled code.
# runs-on cannot be shared: the env context is unavailable there, and a called
# workflow would rename Unified Site Release, which Deploy matches exactly.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "linux", "x64", "monorepo-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
        with:
          dev: true
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
      - name: Lint allowances did not rise
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RATCHET_ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'ratchet-increase') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$RATCHET_ALLOW_INCREASE" = "true" ]; then
            echo "ratchet-increase label is present; a higher allowance is accepted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ratchet-increase label is absent." >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/quality_ratchet.py check-tools "origin/${BASE_REF}"
          tools="$(python3 scripts/quality_ratchet.py list)"
          if [ -z "$tools" ]; then
            echo "quality_ratchet.py list printed no tools" >&2
            exit 1
          fi
          for tool in $tools; do
            python3 scripts/quality_ratchet.py check-base "$tool" "origin/${BASE_REF}"
          done
      - run: ./scripts/coverage-gate.sh finance
      - run: ./scripts/coverage-gate.sh server
      - run: ./scripts/coverage-gate.sh travel
      - run: ./scripts/coverage-gate.sh media
      # Fast boundary checks use the TypeScript resolver from root devDependencies.
      - uses: ./.github/actions/setup-node
        with:
          cache: false
      - run: node --test apps/travel/backend/static/tests/*.test.mjs
      - run: node --test apps/media/backend/static/tests/*.test.mjs apps/finance/frontend/src/auth-ux.test.mjs
      - run: make test-fast
      - run: make lint-python
      - run: make typecheck-python
      - run: pip-audit --disable-pip --no-deps -r apps/server/requirements.lock

  frontend:
    name: Frontend
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "linux", "x64", "monorepo-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node
      - run: npm audit --omit=dev --audit-level=high
      - name: ESLint
        run: make lint-web
      - name: Typecheck
        run: make typecheck-web
      - run: npm run test:finance -- --watch=false --browsers=ChromeHeadlessCI
      - run: npm run test:site -- --watch=false --browsers=ChromeHeadlessCI
      - run: npm run test:web -- --watch=false --browsers=ChromeHeadlessCI
      - name: Karma coverage summary
        if: always()
        run: |
          while IFS= read -r summary; do
            project="$(basename "$(dirname "$summary")")"
            case "$project" in
              finance-app) project=finance ;;
              personal-website) project=site ;;
            esac
            node scripts/karma-coverage-summary.mjs "$summary" "$project"
          done < <(find apps -path '*/coverage/*/coverage-summary.json' -print)
      - name: Shared browser and UI contracts
        run: node --test packages/browser/runtime/*.test.mjs packages/ui/*.test.mjs
      - name: Production bundle
        run: |
          set -euo pipefail
          make build-frontends
          test -d dist/web/browser
          # The three CI runners share this directory. GitHub artifact storage
          # is over quota, and this repository does not upload Actions artifacts.
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            exit 0
          fi
          case "${GITHUB_SHA}" in
            *[!0-9a-f]*|"") echo "refusing unexpected GITHUB_SHA" >&2; exit 1 ;;
          esac
          root=/opt/ci-dist
          dest="$root/${GITHUB_SHA}"
          mkdir -p "$dest"
          rm -rf "$dest/web"
          cp -a dist/web "$dest/web"
          find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -n | head -n -3 | cut -d' ' -f2- | xargs -r rm -rf

  playwright:
    name: Playwright
    needs: frontend
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "linux", "x64", "monorepo-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-playwright
      - name: Production bundle from Frontend
        run: |
          set -euo pipefail
          src="/opt/ci-dist/${GITHUB_SHA}/web"
          if [ -d "$src/browser" ]; then
            mkdir -p dist
            rm -rf dist/web
            cp -a "$src" dist/web
          elif [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            echo "Frontend bundle for ${GITHUB_SHA} is not in /opt/ci-dist" >&2
            exit 1
          else
            make build-frontends
          fi
      # Root projects reuse the domain configs and start isolated servers on
      # demand. One scheduler balances all domains across the four workers.
      - name: Finance, Travel, Media, and Town
        env:
          PYTHON: python
        run: npx playwright test

  unified:
    # deploy.yml "Require the seeded schema rehearsal" matches this name.
    name: Unified Site Release
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "linux", "x64", "monorepo-ci-release"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      # A depth-1 push checkout leaves origin/main with no parents, and
      # github.event.before is not in the clone. The rehearsal also
      # unshallows itself; this keeps the pre-merge commit in the graph.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Rehearsal preflight survives a depth-1 clone
        run: |
          set -euo pipefail
          origin="$(git remote get-url origin)"
          probe="$(mktemp -d)"
          shallow="$(mktemp -d)"
          cleanup() { rm -rf "$probe" "$shallow"; }
          trap cleanup EXIT
          git clone --depth 2 --no-tags "$origin" "$probe"
          upgrade_from="$(git -C "$probe" rev-parse HEAD^1)"
          test -n "$upgrade_from"
          git clone --depth 1 --no-tags "$origin" "$shallow"
          test "$(git -C "$shallow" rev-parse --is-shallow-repository)" = true
          legacy=8dc554e8094237419571551ff82b0fbfe115bfbd
          grep -q "$legacy" scripts/validate-seeded-adoption.sh
          git -C "$shallow" fetch --no-tags origin "$legacy"
          git -C "$shallow" fetch --no-tags origin main
          if git -C "$shallow" merge-base --is-ancestor "$legacy" "$(git -C "$shallow" rev-parse origin/main)"; then
            echo "depth-1 origin/main already has ancestry to $legacy; self-test did not reproduce the failure" >&2
            exit 1
          fi
          if git -C "$shallow" cat-file -e "${upgrade_from}^{commit}" 2>/dev/null; then
            echo "depth-1 clone already contains UPGRADE_FROM $upgrade_from" >&2
            exit 1
          fi
          cp scripts/validate-seeded-adoption.sh "$shallow/scripts/validate-seeded-adoption.sh"
          PREFLIGHT_ONLY=1 UPGRADE_FROM="$upgrade_from" bash "$shallow/scripts/validate-seeded-adoption.sh"
          git -C "$shallow" merge-base --is-ancestor "$legacy" "$(git -C "$shallow" rev-parse origin/main)"
          git -C "$shallow" cat-file -e "${upgrade_from}^{commit}"
          test "$(git -C "$shallow" rev-parse --is-shallow-repository)" = false
          echo "depth-1 preflight passed for UPGRADE_FROM $upgrade_from"
      - uses: ./.github/actions/setup-python
      - name: Check model/migration drift
        run: python -m apps.server.migrations --check
      - name: Decide whether to rehearse schema changes
        id: migrations
        run: |
          set -euo pipefail
          # Anchored, so the Alembic alternative has to consume the rest of
          # the path. A bare "apps/server/alembic/" never matches a file name.
          pattern='^(apps/[^/]+/backend/models\.py|apps/server/alembic(/.*|\.ini)|apps/server/(identity/models|migrations|schema|migrate|database)\.py|scripts/(seed_dev_db\.py|validate-seeded-adoption\.sh|backup-site\.py|deploy-site\.sh)|compose\.yml|Dockerfile|\.github/workflows/ci\.yml)$'
          check() {
            path="$1"
            expect="$2"
            if printf '%s\n' "$path" | grep -Eq "$pattern"; then
              got=run
            else
              got=skip
            fi
            if [ "$got" != "$expect" ]; then
              echo "rehearsal path gate: $path expected $expect, got $got" >&2
              exit 1
            fi
          }
          check apps/server/alembic/versions/site_schema_v2_x.py run
          check apps/server/alembic/env.py run
          check apps/server/alembic.ini run
          check compose.yml run
          check Dockerfile run
          check scripts/deploy-site.sh run
          check .github/workflows/ci.yml run
          check apps/travel/backend/models.py run
          check apps/finance/backend/models.py run
          check apps/server/migrations.py run
          check apps/server/schema.py run
          check apps/server/migrate.py run
          check apps/server/database.py run
          check apps/server/identity/models.py run
          check scripts/seed_dev_db.py run
          check scripts/validate-seeded-adoption.sh run
          check scripts/backup-site.py run
          check apps/server/alembic skip
          check apps/server/main.py skip
          check docs/MIGRATIONS.md skip
          check .github/workflows/deploy.yml skip
          # Push to main always rehearses. A later unrelated commit must not
          # deploy over a red rehearsal that this diff no longer mentions.
          # Pull requests still use the path gate. Either way, a revision
          # file that already exists on the base cannot be edited in place.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="FETCH_HEAD"
          else
            before="${{ github.event.before }}"
            # A new-branch push sets before to forty zeros. A force-push can
            # name a tip this clone cannot fetch. Fall through with the first
            # parent so the revision check still runs, instead of exiting first.
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags origin "$before" || true
              if git cat-file -e "${before}^{commit}" 2>/dev/null; then
                range="$before"
              fi
            fi
            if [ -z "${range:-}" ]; then
              if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
                git fetch --no-tags --deepen=1 origin || true
              fi
              if ! git rev-parse --verify --quiet "HEAD^1" >/dev/null; then
                echo "no parent commit for the revision immutability check; rehearsing anyway" >&2
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              range="HEAD^1"
            fi
          fi
          edited="$(git diff --diff-filter=MDR --name-only "$range" HEAD -- apps/server/alembic/versions/)"
          if [ -n "$edited" ]; then
            echo "existing Alembic revisions were modified or removed; add a new revision instead:" >&2
            printf '%s\n' "$edited" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$range" HEAD | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build immutable production image
        run: docker build --build-arg SITE_RELEASE=${{ github.sha }} --tag personal-site:${{ github.sha }} .
      - name: Exercise unified release
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m,mode=1777 personal-site:${{ github.sha }} python -m apps.server.checks
      # deploy.yml "Require the seeded schema rehearsal" matches this name.
      - name: Seeded schema rehearsals
        if: steps.migrations.outputs.run == 'true'
        env:
          SITE_IMAGE: personal-site:${{ github.sha }}
          PY: python
          REHEARSAL: both
          # Pin off. PREFLIGHT_ONLY=1 exits 0 before any database work, and
          # Deploy accepts this step on its conclusion alone.
          PREFLIGHT_ONLY: "0"
          UPGRADE_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/validate-seeded-adoption.sh
      - uses: ./.github/actions/setup-playwright
      - name: Browser checks against production image
        run: |
          set -euo pipefail
          docker network inspect monitoring >/dev/null 2>&1 || docker network create monitoring
          printf 'SESSION_COOKIE_SECURE=0\nSITE_PORT=8086\nSITE_IMAGE=personal-site:${{ github.sha }}\n' > /tmp/site-ci.env
          docker compose --env-file /tmp/site-ci.env --profile ops run --rm --no-deps backup python -m apps.server.migrate --output /data/site.db
          docker compose --env-file /tmp/site-ci.env up -d --no-build --wait --wait-timeout 60
          node scripts/test-site-browser.mjs
      - name: Browser container diagnostics and cleanup
        if: always()
        run: |
          if [ -f /tmp/site-ci.env ]; then
            docker compose --env-file /tmp/site-ci.env logs --tail 30 || true
            docker compose --env-file /tmp/site-ci.env --profile ops down -v || true
          fi
