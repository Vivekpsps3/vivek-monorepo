name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Finance Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/finance/backend/requirements.txt
      - run: python -m pip install -r apps/finance/backend/requirements.txt
      - working-directory: apps/finance/backend
        run: python -m pytest -q
      - run: make test-fast

  travel-backend:
    name: Travel Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/travel/backend/requirements.txt
            apps/travel/backend/requirements-dev.txt
      - run: python -m pip install -r apps/travel/backend/requirements-dev.txt
      - working-directory: apps/travel/backend
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test apps/travel/backend/static/tests/*.test.mjs

  site-backend:
    name: Site Flask Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/site/flask/requirements.txt
            apps/site/flask/requirements-dev.txt
      - run: python -m pip install -r apps/site/flask/requirements-dev.txt
      - run: python -m pytest -q apps/site/flask/tests

  frontends:
    name: Frontend Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: apps/finance/frontend, lock: apps/finance/frontend/package-lock.json }
          - { dir: apps/site, lock: apps/site/package-lock.json }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app.lock }}
      - working-directory: ${{ matrix.app.dir }}
        run: npm ci
      - working-directory: ${{ matrix.app.dir }}
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - working-directory: ${{ matrix.app.dir }}
        run: npx ng build --configuration development

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: docker compose build
      - run: make test-suite-routes
