name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Finance Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/finance/backend/requirements.txt
      - run: python -m pip install -r apps/finance/backend/requirements.txt
      - working-directory: apps/finance/backend
        run: python -m pytest -q
      - run: ./scripts/check-doc-paths.sh

  frontends:
    name: Frontend Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: apps/finance/frontend, lock: apps/finance/frontend/package-lock.json }
          - { dir: apps/site, lock: apps/site/package-lock.json }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app.lock }}
      - working-directory: ${{ matrix.app.dir }}
        run: npm ci
      - if: matrix.app.dir == 'apps/finance/frontend'
        working-directory: apps/finance/frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - working-directory: ${{ matrix.app.dir }}
        run: npx ng build --configuration development

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
