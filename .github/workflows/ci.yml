name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Finance Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock && python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint allowances did not rise
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          for tool in ruff mypy eslint-finance eslint-site eslint-packages suppressions; do
            python3 scripts/quality_ratchet.py check-base "$tool" "origin/${{ github.base_ref }}"
          done
      - run: ./scripts/coverage-gate.sh finance
      - run: ./scripts/coverage-gate.sh server
      - run: make test-fast
      - run: make lint-python
      - run: make typecheck-python
      - run: pip-audit --disable-pip --no-deps -r apps/server/requirements.lock

  travel-backend:
    name: Travel Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
            apps/travel/backend/requirements.txt
            apps/travel/backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock && python -m pip install --require-hashes -r requirements-dev.txt
      - run: ./scripts/coverage-gate.sh travel
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test apps/travel/backend/static/tests/*.test.mjs

  media-backend:
    name: Media Journal Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/server/requirements.lock
            requirements-dev.txt
            apps/media/backend/requirements.txt
            apps/media/backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/server/requirements.lock && python -m pip install --require-hashes -r requirements-dev.txt
      - run: ./scripts/coverage-gate.sh media
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test apps/media/backend/static/tests/*.test.mjs

  frontends:
    name: Frontend Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: apps/finance/frontend, lock: apps/finance/frontend/package-lock.json }
          - { dir: apps/site, lock: apps/site/package-lock.json }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app.lock }}
      - working-directory: ${{ matrix.app.dir }}
        run: npm ci
      - working-directory: ${{ matrix.app.dir }}
        run: npm audit --omit=dev --audit-level=high
      - name: ESLint
        run: |
          if [ "${{ matrix.app.dir }}" = "apps/finance/frontend" ]; then
            python3 scripts/quality_ratchet.py check eslint-finance
            python3 scripts/quality_ratchet.py check eslint-packages
          else
            python3 scripts/quality_ratchet.py check eslint-site
          fi
      - name: Typecheck
        run: |
          if [ "${{ matrix.app.dir }}" = "apps/finance/frontend" ]; then
            npx --prefix apps/finance/frontend tsc -p apps/finance/frontend/tsconfig.app.json --noEmit --pretty false
            npx --prefix apps/finance/frontend tsc -p apps/finance/frontend/tsconfig.spec.json --noEmit --pretty false
            npx --prefix apps/finance/frontend tsc -p packages/tsconfig.json --noEmit --pretty false
          else
            npx --prefix apps/site tsc -p apps/site/tsconfig.app.json --noEmit --pretty false
            npx --prefix apps/site tsc -p apps/site/tsconfig.spec.json --noEmit --pretty false
          fi
      - working-directory: ${{ matrix.app.dir }}
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI
      - name: Karma coverage summary
        if: always()
        working-directory: ${{ matrix.app.dir }}
        run: |
          if [ ! -d coverage ]; then
            exit 0
          fi
          summary=$(find coverage -name coverage-summary.json -print -quit)
          if [ -n "$summary" ]; then
            node "$GITHUB_WORKSPACE/scripts/karma-coverage-summary.mjs" "$summary" "${{ matrix.app.dir }}"
          fi
      - working-directory: ${{ matrix.app.dir }}
        run: npx ng build --configuration production

  unified:
    name: Unified Site Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build immutable production image
        run: docker build --build-arg SITE_RELEASE=${{ github.sha }} --tag personal-site:${{ github.sha }} .
      - name: Exercise unified release
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m,mode=1777 personal-site:${{ github.sha }} python -m apps.server.checks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/finance/frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install browser tooling
        working-directory: apps/finance/frontend
        run: |
          npm ci
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser checks against production image
        run: |
          set -euo pipefail
          docker network create monitoring
          printf 'SESSION_COOKIE_SECURE=0\nSITE_PORT=8086\nSITE_IMAGE=personal-site:${{ github.sha }}\n' > /tmp/site-ci.env
          docker compose --env-file /tmp/site-ci.env --profile ops run --rm --no-deps backup python -m apps.server.migrate --output /data/site.db
          docker compose --env-file /tmp/site-ci.env up -d --no-build --wait --wait-timeout 60
          node scripts/test-site-browser.mjs
      - name: Browser container diagnostics and cleanup
        if: always()
        run: |
          if [ -f /tmp/site-ci.env ]; then
            docker compose --env-file /tmp/site-ci.env logs --tail 30 || true
            docker compose --env-file /tmp/site-ci.env --profile ops down -v || true
          fi
      - name: Package tested image
        run: |
          set -euo pipefail
          docker save personal-site:${{ github.sha }} | gzip > image.tar.gz
          echo "${{ github.sha }}" > release.sha
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-site-release
          path: |
            image.tar.gz
            release.sha
          retention-days: 14

  e2e:
    name: Finance Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/finance/frontend/package-lock.json
      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/finance/frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npm ci --prefix apps/finance/frontend
      - name: Install Playwright browser
        working-directory: apps/finance/frontend
        run: |
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - run: make e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            apps/finance/frontend/test-results
            apps/finance/frontend/playwright-report
          retention-days: 7
